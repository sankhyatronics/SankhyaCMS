name: Publish packages to npm

# Publishes @sankhyatronics/sankhya-cms and @sankhyatronics/sankhya-cms-react via npm trusted publishing (OIDC).
# Run it from a GitHub release, or by hand (a manual run defaults to a dry run).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack only — do not publish
        type: boolean
        default: true

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # pnpm rewrites `workspace:` ranges and skips versions already on npm; core goes first
      - name: Publish @sankhyatronics/sankhya-cms
        run: pnpm --filter @sankhyatronics/sankhya-cms publish --access public --no-git-checks $DRY_RUN
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}

      - name: Publish @sankhyatronics/sankhya-cms-react
        run: pnpm --filter @sankhyatronics/sankhya-cms-react publish --access public --no-git-checks $DRY_RUN
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
