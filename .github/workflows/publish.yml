name: Publish packages to npm

# Publishes @sankhyatronics/sankhya-cms and @sankhyatronics/sankhya-cms-react via npm trusted publishing (OIDC).
# Run it from a GitHub release, or by hand (a manual run defaults to a dry run).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack only — do not publish
        type: boolean
        default: true

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false # never use caching in release builds

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # pnpm pack rewrites `workspace:` ranges; npm publishes the tarball (npm does the OIDC exchange). Core goes first.
      - name: Publish @sankhyatronics/sankhya-cms
        run: |
          pnpm --filter @sankhyatronics/sankhya-cms pack --pack-destination "$RUNNER_TEMP/core"
          npm --version
          npm publish "$RUNNER_TEMP"/core/*.tgz --access public --loglevel verbose $DRY_RUN
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}

      - name: Publish @sankhyatronics/sankhya-cms-react
        run: |
          pnpm --filter @sankhyatronics/sankhya-cms-react pack --pack-destination "$RUNNER_TEMP/react"
          npm publish "$RUNNER_TEMP"/react/*.tgz --access public --loglevel verbose $DRY_RUN
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
