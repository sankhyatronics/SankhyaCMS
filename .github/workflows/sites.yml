name: Deploy Storybook

# Builds the component Storybook and uploads it over FTP to the Sankhyatronics docs hub, under
# docs.sankhyatronics.com/sankhya-cms/storybook. The Sankhya CMS docs pages themselves live in, and are
# deployed from, the SankhyaPortals repo (sankhya-docs). Manual only.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          STORYBOOK_DISABLE_TELEMETRY: '1'

      # Only touch the storybook/ folder: the rest of public_html/sankhya-cms/ belongs to the SankhyaPortals docs deploy.
      - name: Deploy Storybook
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          # TODO: confirm the docs.sankhyatronics.com FTP account name (the SankhyaPortals hub deploy still uses the sankhyabook365 account)
          username: ${{ secrets.FTP_USERNAME }}.docs.sankhyatronics.com
          password: ${{ secrets.FTP_PASSWORD }}
          dangerous-clean-slate: true
          server-dir: ./public_html/sankhya-cms/storybook/
          local-dir: storybook/storybook-static/
