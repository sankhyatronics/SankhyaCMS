packages:
  - "packages/*"
  - "tooling/*"
  - "storybook"
  - "docs"

allowBuilds:
  esbuild: true
  core-js: false # postinstall only prints a donation banner
  rs-module-lexer: false # native binary ships prebuilt via optional deps

catalog:
  '@custom-elements-manifest/analyzer': 0.11.0
  '@docusaurus/core': 3.10.2
  '@docusaurus/faster': 3.10.2
  '@docusaurus/module-type-aliases': 3.10.2
  '@docusaurus/preset-classic': 3.10.2
  '@docusaurus/tsconfig': 3.10.2
  '@docusaurus/types': 3.10.2
  '@emotion/is-prop-valid': 1.4.0
  '@mdx-js/react': 3.1.1
  clsx: 2.1.1
  prism-react-renderer: 2.4.1
  '@storybook/addon-a11y': 10.6.1
  '@storybook/addon-docs': 10.6.1
  '@storybook/addon-themes': 10.6.1
  '@storybook/web-components-vite': 10.6.1
  storybook: 10.6.1
  '@iconify/react': 6.0.2
  '@lit/react': 1.0.8
  '@types/node': 26.6.4
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  jsdom: 30.1.2
  lit: 3.3.3
  motion: 14.0.0
  oxlint: 1.87.0
  react: 19.3.0
  react-dom: 19.3.0
  react-markdown: 10.1.0
  react-router: 8.4.0
  remark-breaks: 4.0.0
  remark-gfm: 4.0.1
  rimraf: 6.1.3
  tsup: 8.5.1
  typescript: 6.0.3  # TS 7 (native) breaks tsup's dts build (rollup-plugin-dts needs the JS compiler API)
  vite: 8.3.4
  vite-plugin-dts: 5.1.2
  vite-plugin-lib-inject-css: 2.2.2
  vitest: 5.0.3

minimumReleaseAgeExclude:
  - vite@8.3.4
